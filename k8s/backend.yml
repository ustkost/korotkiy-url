apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: korotkiy-url/backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
          env:
            - name: PORT
              value: "$(BACKEND_PORT)"
            - name: DB_USER
              value: "$(POSTGRES_USER)"
            - name: DB_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: DB_NAME
              value: "$(POSTGRES_DB)"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: "http"
      port: 8080
      targetPort: 8080
    - name: "metrics"
      port: 9090
      targetPort: 9090
