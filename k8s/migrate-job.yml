apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: korotkiy-url-migrate:latest
          imagePullPolicy: Never
          args:
            - "-path"
            - "/migrations"
            - "-database"
            - "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)?sslmode=disable"
            - "up"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credentials
