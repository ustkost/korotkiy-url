role: Agent

service:
  enabled: false
serviceHeadless:
  enabled: false

image:
  tag: 0.59.0-alpine

customConfig:
  data_dir: /vector-data-dir
  sources:
    k8s:
      type: kubernetes_logs
  transforms:
    parse_json:
      type: remap
      inputs: [k8s]
      source: |
        parsed, err = parse_json(.message)
        if err == null && is_object(parsed) {
          . = merge!(., object!(parsed))
        }
  sinks:
    vlogs:
      type: elasticsearch
      inputs: [parse_json]
      endpoints: ["http://victoria-logs-victoria-logs-single-server:9428/insert/elasticsearch/"]
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      request:
        headers:
          VL-Time-Field: timestamp
          VL-Stream-Fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
          VL-Msg-Field: message,msg,_msg
          AccountID: "0"
          ProjectID: "0"
