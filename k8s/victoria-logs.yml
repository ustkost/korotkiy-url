apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels: {app: victoria-logs}
  template:
    metadata:
      labels: {app: victoria-logs}
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - -storageDataPath=/vlogs
            - -retentionPeriod=7d
          ports:
            - containerPort: 9428
          volumeMounts:
            - {name: data, mountPath: /vlogs}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  selector: {app: victoria-logs}
  ports:
    - port: 9428
      targetPort: 9428
